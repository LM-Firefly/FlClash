name: Update submodule
on:
  repository_dispatch:
    types:
      - core-updated
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  # 自动取消其他运行中的workflow
  cancel-in-progress: true

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    env:
      GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{env.GIT_TOKEN}}

      - name: Checkout and Update submodules
        run: git submodule update --init --recursive --remote --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 24

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install update-go-mod-replace
        run: |
          go install github.com/metacubex/update-go-mod-replace@latest

      - name: Update Gomod
        run: |
          cd ${{ github.workspace }}/core/
          update-go-mod-replace ${{ github.workspace }}/core/Clash.Meta/go.mod $(pwd)/go.mod
          go mod tidy

      - name: Commit updated dependencies
        uses: EndBug/add-and-commit@v9
        with:
          add: "-A"
          author_email: mail@example.com
          default_author: github_actions
          github_token: ${{ env.GIT_TOKEN }}
          message: "Updated dependencies 🎉 "

      #      - uses: tibdex/github-app-token@v2
      #        id: generate-token
      #        with:
      #          app_id: ${{ secrets.MAINTAINER_APPID }}
      #          private_key: ${{ secrets.MAINTAINER_APP_PRIVATE_KEY }}
